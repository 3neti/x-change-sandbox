name: linter

on:
  push:
    branches: [develop, main, master, workos]
  pull_request:
    branches: [develop, main, master, workos]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Detect frontend changes
        id: frontend
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          git fetch origin "$base"
          if git diff --quiet "$base" HEAD -- resources tests/playwright package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.frontend.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node Dependencies
        if: steps.frontend.outputs.changed == 'true'
        run: npm ci

      - name: Format Frontend Check
        if: steps.frontend.outputs.changed == 'true'
        run: npm run format:check --if-present

      - name: Lint Frontend
        if: steps.frontend.outputs.changed == 'true'
        run: npm run lint:check --if-present
